<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 416" width="1200" height="416" role="img" aria-label="What it does: Solo persona studio; Dual screenplay; Script and voice design; Takes you can keep">
<title>What it does: Solo persona studio; Dual screenplay; Script and voice design; Takes you can keep</title>
<style>.c0{opacity:0;animation:in .7s 0.00s ease-out forwards}.c1{opacity:0;animation:in .7s 0.15s ease-out forwards}.c2{opacity:0;animation:in .7s 0.30s ease-out forwards}.c3{opacity:0;animation:in .7s 0.45s ease-out forwards}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d1f24"/><stop offset="1" stop-color="#101114"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
  <radialGradient id="glow" cx=".82" cy=".1" r=".9"><stop offset="0" stop-color="#818cf8" stop-opacity=".22"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow2" cx=".1" cy="1" r=".7"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".14"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
  
</defs>
<rect width="1200" height="416" rx="28" fill="url(#bg)"/>
<rect width="1200" height="416" rx="28" fill="url(#glow)"/>
<rect width="1200" height="416" rx="28" fill="url(#glow2)"/>
<rect x=".5" y=".5" width="1199" height="415" rx="27.5" fill="none" stroke="rgba(255,255,255,0.13)"/>
<g class="c0"><rect x="64.0" y="48" width="526" height="150" rx="18" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,0.13)"/><rect x="88.0" y="74" width="28" height="4" rx="2" fill="#f472b6"/><text x="88.0" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.3">Solo persona studio</text><text x="88.0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0">Six voice archetypes, style and emotion intensity, pitch and</text><text x="88.0" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0">speed, and prosody tags for breaths, laughs, gasps and pauses.</text></g><g class="c1"><rect x="610.0" y="48" width="526" height="150" rx="18" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,0.13)"/><rect x="634.0" y="74" width="28" height="4" rx="2" fill="#f472b6"/><text x="634.0" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.3">Dual screenplay</text><text x="634.0" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0">Paste a whole script in one block. Speakers are detected line</text><text x="634.0" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0">by line and voiced as one natural conversation.</text></g><g class="c2"><rect x="64.0" y="218" width="526" height="150" rx="18" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,0.13)"/><rect x="88.0" y="244" width="28" height="4" rx="2" fill="#f472b6"/><text x="88.0" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.3">Script and voice design</text><text x="88.0" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0">An assistant tightens a rough script into a performable one,</text><text x="88.0" y="332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0">and a voice designer drafts a persona to match.</text></g><g class="c3"><rect x="610.0" y="218" width="526" height="150" rx="18" fill="rgba(255,255,255,.045)" stroke="rgba(255,255,255,0.13)"/><rect x="634.0" y="244" width="28" height="4" rx="2" fill="#f472b6"/><text x="634.0" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#f5f5f7" text-anchor="start" letter-spacing="-0.3">Takes you can keep</text><text x="634.0" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0">Streaming playback, a waveform player with WAV export, a live</text><text x="634.0" y="332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#a1a1aa" text-anchor="start" letter-spacing="0">spectrum view and a history of every take.</text></g>
</svg>
