<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Phonosphere Studio: Speech synthesis and prosody studio. A studio for directing synthetic speech: shape a voice&#x27;s style, emotion and timing, or voice a whole two-person script in one pass.">
<title>Phonosphere Studio: Speech synthesis and prosody studio. A studio for directing synthetic speech: shape a voice&#x27;s style, emotion and timing, or voice a whole two-person script in one pass.</title>
<style>.up{opacity:0;animation:up .8s ease-out forwards}.u1{animation-delay:.2s}.u2{animation-delay:.45s}.u3{animation-delay:.7s}.u4{animation-delay:.95s}@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.halo{transform-origin:950px 230px;animation:halo 5s ease-in-out infinite}@keyframes halo{0%,100%{opacity:.35;transform:scale(.94)}50%{opacity:.75;transform:scale(1.04)}}.mk{opacity:0;transform-origin:950px 230px;animation:mk 1.2s .3s cubic-bezier(.2,.9,.3,1.2) forwards,float 7s 1.5s ease-in-out infinite}@keyframes mk{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}.ring{transform-origin:950px 230px;animation:spin 40s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d1f24"/><stop offset="1" stop-color="#101114"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset=".5" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
  <radialGradient id="glow" cx=".82" cy=".1" r=".9"><stop offset="0" stop-color="#818cf8" stop-opacity=".22"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow2" cx=".1" cy="1" r=".7"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".14"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
  <radialGradient id="aura" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#f472b6" stop-opacity=".45"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1200" height="460" rx="28" fill="url(#bg)"/>
<rect width="1200" height="460" rx="28" fill="url(#glow)"/>
<rect width="1200" height="460" rx="28" fill="url(#glow2)"/>
<rect x=".5" y=".5" width="1199" height="459" rx="27.5" fill="none" stroke="rgba(255,255,255,0.13)"/>
